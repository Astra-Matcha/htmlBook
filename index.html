<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 책장</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4efe6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      padding: 48px 20px;
      display: flex;
      justify-content: center;
    }

    .bookshelf-wrap {
      width: 100%;
      max-width: 920px;
    }

    /* 한 칸 선반 위 책들이 나란히 꽂히는 영역 */
    .shelf-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 6px;
      padding: 0 20px;
    }

    /* 세로로 꽂힌 책(책등) */
    .spine {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 54px;
      height: 230px;
      padding: 14px 6px;
      border-radius: 3px 3px 0 0;
      text-decoration: none;
      color: #ffffff;
      background-color: #4a607a;
      box-shadow:
        inset 3px 0 5px rgba(255, 255, 255, 0.14),
        inset -3px 0 6px rgba(0, 0, 0, 0.35),
        2px -2px 6px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* 책등 상단/하단 장식선 */
    .spine::before,
    .spine::after {
      content: "";
      display: block;
      width: 76%;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    .spine:hover {
      transform: translateY(-14px);
      box-shadow:
        inset 3px 0 5px rgba(255, 255, 255, 0.2),
        inset -3px 0 6px rgba(0, 0, 0, 0.35),
        4px 8px 14px rgba(0, 0, 0, 0.22);
    }

    /* 세로 방향 제목 */
    .spine-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 175px;
    }

    /* 책 높이 및 두께 변형 옵션 */
    .h-tall { height: 245px; }
    .h-med { height: 225px; }
    .h-short { height: 205px; }
    .w-wide { width: 66px; }
    .w-thin { width: 44px; }

    /* 책등 색상 옵션 */
    .c-navy { background-color: #2c3e50; }
    .c-green { background-color: #3b6e5c; }
    .c-blue { background-color: #3a6ea5; }
    .c-rust { background-color: #b85d3b; }
    .c-charcoal { background-color: #2b2d42; }
    .c-wine { background-color: #7a3e3e; }
    .c-plum { background-color: #5c4d7d; }
    .c-olive { background-color: #588157; }
    .c-ochre { background-color: #b07d2b; }
    .c-teal { background-color: #2f6f73; }

    /* 선반 받침대 */
    .shelf-board {
      width: 100%;
      height: 20px;
      background: linear-gradient(to bottom, #8d5b3c, #5c3a21);
      border-radius: 4px;
      margin-bottom: 40px;
      box-shadow: 0 7px 14px rgba(0, 0, 0, 0.24);
    }
  </style>
</head>
<body>
  <main class="bookshelf-wrap">
    <!-- 첫 번째 선반 -->
    <div class="shelf-row">
      <a class="spine h-tall w-wide c-navy" href="/books/The Wings.html">
        <span class="spine-title">날개 - 이상</span>
      </a>
      <a class="spine h-med c-green" href="/books/hesse-demian.html">
        <span class="spine-title">데미안</span>
      </a>
      <a class="spine h-short w-thin c-blue" href="/books/little-prince-kr.html">
        <span class="spine-title">어린 왕자</span>
      </a>
      <a class="spine h-med w-wide c-rust" href="/books/alchemist-note.html">
        <span class="spine-title">연금술사</span>
      </a>
      <a class="spine h-tall c-charcoal" href="/books/cosmos-sagan.html">
        <span class="spine-title">코스모스</span>
      </a>
      <a class="spine h-med w-wide c-wine" href="/books/sapiens-summary.html">
        <span class="spine-title">사피엔스</span>
      </a>
      <a class="spine h-short c-plum" href="/books/ningen-shikkaku.html">
        <span class="spine-title">인간 실격</span>
      </a>
      <a class="spine h-med c-olive" href="/books/vegetarian-review.html">
        <span class="spine-title">채식주의자</span>
      </a>
      <a class="spine h-tall w-thin c-ochre" href="/books/norwegian-wood.html">
        <span class="spine-title">상실의 시대</span>
      </a>
      <a class="spine h-short w-wide c-teal" href="/books/crime-and-punishment.html">
        <span class="spine-title">죄와 벌</span>
      </a>
    </div>
    <div class="shelf-board"></div>

    <!-- 두 번째 선반 -->
    <div class="shelf-row">
      <a class="spine h-med w-wide c-plum" href="/books/rakugo-jugemu.html">
        <span class="spine-title">주게무 이야기</span>
      </a>
      <a class="spine h-tall c-blue" href="/books/ukiyoe-wave.html">
        <span class="spine-title">가나가와 해변</span>
      </a>
      <a class="spine h-short c-green" href="/books/bistro-notes.html">
        <span class="spine-title">주방 일지</span>
      </a>
    </div>
    <div class="shelf-board"></div>
  </main>
</body>
</html>
